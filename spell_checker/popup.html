<!DOCTYPE html>
<html>
<head>
  <title>Spell Checker</title>
  <style>
    body { font-family: sans-serif; padding: 10px; width: 300px; }
    textarea { width: 100%; height: 80px; }
    button { margin-top: 10px; }

</head>
<body>

  <script src="popup.js"></script>
</body>
</html>
